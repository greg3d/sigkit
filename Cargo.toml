[workspace]
resolver = "3"
members = ["sigkit-format", "sigkit-cli", "sigkit-viewer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
memmap2 = "0.9"
eframe = "0.37"
egui = "0.37"
